<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" />
  <rect width="800" height="500" fill="url(#grid)" />

  <!-- Accent glow -->
  <circle cx="400" cy="220" r="160" fill="rgba(59, 130, 246, 0.08)" />

  <!-- Newspaper / News icon -->
  <g transform="translate(350, 160)" stroke="url(#accent)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 22h14a2 2 0 0 0 2-2V7.5L14.5 2H6a2 2 0 0 0-2 2v4" />
    <polyline points="14 2 14 8 20 8" />
    <path d="M2 15h10" />
    <path d="M2 19h8" />
    <circle cx="50" cy="50" r="28" stroke="rgba(59, 130, 246, 0.4)" stroke-width="2" />
  </g>

  <!-- Title Text -->
  <text x="400" y="320" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" letter-spacing="4">
    NOTICIAS HOLCIM
  </text>
  <text x="400" y="348" text-anchor="middle" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="2">
    ACTUALIDAD &bull; DEPORTES &bull; PLANTA
  </text>

  <!-- Subtle bottom decorative line -->
  <rect x="320" y="375" width="160" height="3" rx="1.5" fill="url(#accent)" opacity="0.6" />
</svg>
